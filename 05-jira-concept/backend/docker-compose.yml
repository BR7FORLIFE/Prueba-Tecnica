services:
  postgres: 
    image: postgres:17
    container_name: database
    ports: 
      - 5432:5432
    environment: 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - backend-network
    volumes: 
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    networks:
      - backend-network

volumes: 
  pg_data:
networks: 
  backend-network: