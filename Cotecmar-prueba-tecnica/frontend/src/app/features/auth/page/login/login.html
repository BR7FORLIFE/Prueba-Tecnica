<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="flex flex-col w-full max-w-sm mx-auto p-8 bg-white/10 backdrop-blur-md rounded-2xl shadow-lg gap-6"
>
  <h2 class="text-2xl font-semibold text-center text-white">Iniciar Sesión</h2>

  <div class="flex flex-col w-full">
    <label for="username" class="text-sm text-gray-400 mb-1">Usuario</label>
    <input
      type="text"
      id="username"
      placeholder="Ingresa tu usuario..."
      formControlName="username"
      autocomplete="username"
      class="px-4 py-2 rounded-lg bg-white/20 border border-white/30 text-black placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white/30 transition-all duration-200"
    />
  </div>

  <div class="flex flex-col w-full">
    <label for="password" class="text-sm text-gray-400 mb-1">Contraseña</label>
    <input
      type="password"
      id="password"
      placeholder="Ingresa tu contraseña..."
      formControlName="password"
      autocomplete="current-password"
      class="px-4 py-2 rounded-lg bg-white/20 border border-white/30 text-black placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:bg-white/30 transition-all duration-200"
    />
  </div>

  <button
    type="submit"
    [disabled]="form.invalid"
    class="w-full py-2 mt-4 text-white font-medium bg-blue-500 hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg transition-all duration-200 shadow-md"
  >
    Iniciar Sesión
  </button>

  @if (message) {
  <span
    class="text-sm mt-2 text-center font-medium"
    [class.text-red-400]="form.invalid"
    [class.text-green-400]="form.valid"
  >
    {{ message }}
  </span>
  }
</form>
