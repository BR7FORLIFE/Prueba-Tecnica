<form
  [formGroup]="form"
  (submit)="submit()"
  class="flex flex-col w-full max-w-md mx-auto p-8 bg-white/10 backdrop-blur-md rounded-2xl shadow-lg gap-6"
>
  <h2 class="text-2xl font-semibold text-center text-white mb-4">Registro</h2>

  <!-- Username -->
  <div class="flex flex-col">
    <label for="username" class="text-gray-400 mb-1">Usuario</label>
    <input
      type="text"
      id="username"
      placeholder="Ingresa tu usuario..."
      formControlName="username"
      autocomplete="username"
      class="px-4 py-2 rounded-lg bg-white/20 border border-white/30 text-black placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all duration-200"
    />
  </div>

  <!-- Password -->
  <div class="flex flex-col">
    <label for="password" class="text-gray-400 mb-1">Contraseña</label>
    <input
      type="password"
      id="password"
      placeholder="Ingresa tu contraseña"
      formControlName="password"
      autocomplete="current-password"
      class="px-4 py-2 rounded-lg bg-white/20 border border-white/30 text-black placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all duration-200"
    />
  </div>

  <!-- Botón -->
  <button
    type="submit"
    [disabled]="form.invalid"
    class="w-full py-2 mt-2 text-white font-medium bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg transition-all duration-200 shadow-md"
  >
    Registrarse
  </button>
</form>
