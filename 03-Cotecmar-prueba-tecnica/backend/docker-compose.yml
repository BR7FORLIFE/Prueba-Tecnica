version: "3.9"

services:
  app:
    image: cotecmar-prueba-tecnica
    container_name: cotecmar
    ports:
      - "8081:8080"
    volumes:
      - sqlite_data:/app/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/app/data/minucia.db
      SPRING_PROFILES_ACTIVE: sqlite

volumes:
  sqlite_data:
